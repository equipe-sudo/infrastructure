# ============================================
# Nginx — Reverse Proxy (Cloudflare Tunnel → Nginx)
# ============================================
# O cloudflared faz tunnel para http://frontend:80
# Toda requisição chega pelo Cloudflare → HTTPS garantido

server {
    listen 80;
    server_name _;

    # Confiar nos headers do Cloudflare Tunnel
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 0.0.0.0/0;

    root /usr/share/nginx/html;
    index index.html;

    # Health check para Cloudflare Tunnel
    location /health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # Frontend estático
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso para API backend
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # Swagger/OpenAPI docs
    location /docs {
        proxy_pass http://backend:8000/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Cache de assets estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
}
