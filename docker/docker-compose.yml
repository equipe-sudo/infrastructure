# ============================================
# Docker Compose — Todo App Cloud (equipe-sudo)
# ============================================
# Arquitetura com Cloudflare Tunnel:
#   Internet → Cloudflare → Tunnel → cloudflared → equipe-sudo.kolpzs.com
#   Nenhuma porta exposta para internet além de SSH:22
#
# Uso:
#   docker compose pull
#   docker compose up -d
#   docker compose ps

version: "3.8"

services:
  # ==========================================
  # Cloudflare Tunnel — conecta kolpzs.com à VM
  # ==========================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: todo-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - app-net
    # Sem portas expostas — comunicação outbound-only para Cloudflare edge

  # ==========================================
  # Banco de Dados MongoDB (interno, sem porta exposta)
  # ==========================================
  mongo:
    image: mongo:7
    container_name: todo-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-rootpassword}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-todo-app}
    volumes:
      - mongo-data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      app-net:
        aliases:
          - mongo-todo

  # ==========================================
  # Backend Express (interno, sem porta exposta)
  # ==========================================
  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/equipe-sudo/equipe-sudo-backend:latest}
    container_name: todo-backend
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-root}:${MONGO_INITDB_ROOT_PASSWORD:-rootpassword}@mongo:27017/${MONGO_INITDB_DATABASE:-todo-app}?authSource=admin
      HOST: 0.0.0.0
      PORT: 5000
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      app-net:

  # ==========================================
  # Nginx — serve frontend + proxy backend
  # ==========================================
  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/equipe-sudo/equipe-sudo-frontend:latest}
    container_name: todo-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      app-net:

volumes:
  mongo-data:
    name: todo-mongo-data

networks:
  app-net:
    name: todo-app-net
    driver: bridge
