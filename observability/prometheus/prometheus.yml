# ============================================
# Prometheus — armazenamento de métricas
# ============================================
# Recebe métricas por remote_write do OpenTelemetry Collector
# (--web.enable-remote-write-receiver). O scrape local serve apenas para
# as métricas do próprio Prometheus.

global:
  scrape_interval: 60s
  evaluation_interval: 60s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
