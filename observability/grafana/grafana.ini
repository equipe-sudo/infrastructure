# ============================================
# Grafana — configuração
# ============================================

[server]
root_url = https://grafana-equipe-sudo.kolpzs.com
serve_from_sub_path = false
http_port = 3000

[analytics]
reporting_enabled = false
check_for_updates = false

[security]
admin_user = admin
cookie_secure = true
disable_gravatar = true

[users]
allow_sign_up = false
auto_assign_org_role = Viewer

[auth.anonymous]
enabled = false

[log]
level = warn
mode = console
