# ============================================
# Stack de observabilidade — equipe-sudo
# ============================================
# Executada na VM de observabilidade (subnet 10.0.2.0/24), isolada da VM da
# aplicação. A única comunicação aceita da aplicação é OTLP (4317/4318).
#
#   Internet → Cloudflare → Tunnel(obs) → grafana:3000
#   App (VM 10.0.1.x) → otel-collector:4317/4318 → Prometheus/Loki → Grafana
#
# Uso:
#   docker compose --env-file .env pull
#   docker compose --env-file .env up -d

version: "3.8"

services:
  # ==========================================
  # OpenTelemetry Collector — coleta e roteia
  # ==========================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    container_name: obs-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yaml"]
    environment:
      PUBLIC_HEALTH_URL: ${PUBLIC_HEALTH_URL:-https://equipe-sudo.kolpzs.com/api/health}
      PUBLIC_READY_URL: ${PUBLIC_READY_URL:-https://equipe-sudo.kolpzs.com/api/health/ready}
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-dev}
    volumes:
      - ./otel/config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC — aceito apenas da subnet da aplicação
      - "4318:4318" # OTLP HTTP — aceito apenas da subnet da aplicação
    mem_limit: 256m
    networks: [obs-net]

  # ==========================================
  # Prometheus — armazenamento de métricas
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: obs-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1500MB
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 320m
    networks: [obs-net]

  # ==========================================
  # Loki — armazenamento de logs
  # ==========================================
  loki:
    image: grafana/loki:3.1.1
    container_name: obs-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    mem_limit: 320m
    networks: [obs-net]

  # ==========================================
  # Grafana — visualização
  # ==========================================
  grafana:
    image: grafana/grafana:11.2.0
    container_name: obs-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: https://${GRAFANA_HOST:-grafana-equipe-sudo.kolpzs.com}
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 256m
    depends_on: [prometheus, loki]
    networks: [obs-net]

  # ==========================================
  # Cloudflare Tunnel — acesso remoto ao Grafana
  # ==========================================
  # Túnel dedicado à observabilidade (token próprio), separado do túnel da
  # aplicação. Assim a VM da aplicação nunca precisa alcançar o Grafana.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: obs-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${GRAFANA_TUNNEL_TOKEN}
    mem_limit: 96m
    depends_on: [grafana]
    networks: [obs-net]

volumes:
  prometheus-data:
    name: obs-prometheus-data
  loki-data:
    name: obs-loki-data
  grafana-data:
    name: obs-grafana-data

networks:
  obs-net:
    name: obs-net
    driver: bridge
