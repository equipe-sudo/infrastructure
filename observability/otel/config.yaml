# ============================================
# OpenTelemetry Collector — VM de observabilidade
# ============================================
# Recebe telemetria (OTLP) da aplicação e executa a verificação sintética
# de disponibilidade pelo domínio público.
#
# Fluxo:
#   aplicação (OTLP 4317/4318) ─┐
#   probe do domínio ───────────┴─► Collector ─┬─► Prometheus (remote_write) ─► Grafana
#                                              └─► Loki (OTLP/HTTP) ──────────► Grafana

receivers:
  # Telemetria enviada pela aplicação (unica porta exposta para a subnet da app)
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Verificação sintética de disponibilidade "pelo domínio configurado".
  # Gera httpcheck.status (1/0 por classe) e httpcheck.duration.
  http_check/public_health:
    collection_interval: 30s
    initial_delay: 5s
    metrics:
      httpcheck.duration:
        enabled: true
      httpcheck.validation.passed:
        enabled: true
      httpcheck.validation.failed:
        enabled: true
    targets:
      # Liveness: nginx -> backend (Express)
      - endpoint: ${env:PUBLIC_HEALTH_URL}
        method: GET
        validations:
          - json_path: "status"
            equals: "ok"
      # Readiness: nginx -> backend -> MongoDB
      - endpoint: ${env:PUBLIC_READY_URL}
        method: GET
        validations:
          - json_path: "status"
            equals: "ready"

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 180
    spike_limit_mib: 30

  resource:
    attributes:
      # NÃO definir service.name aqui: isso sobrescreveria o service.name que
      # cada serviço já envia (ex.: equipe-sudo-backend). O probe é
      # identificado pelo próprio nome da métrica (httpcheck_*).
      - key: deployment.environment
        value: ${env:DEPLOYMENT_ENVIRONMENT}
        action: upsert

  batch:
    timeout: 10s
    send_batch_size: 512

exporters:
  # Métricas -> Prometheus (receiver de remote_write)
  prometheus_remote_write:
    endpoint: http://prometheus:9090/api/v1/write
    resource_to_telemetry_conversion:
      enabled: true

  # Logs -> Loki (ingestão OTLP nativa do Loki 3.x)
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  debug:
    verbosity: basic

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
    metrics:
      level: none
  pipelines:
    metrics:
      receivers: [otlp, http_check/public_health]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus_remote_write]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp_http/loki]
