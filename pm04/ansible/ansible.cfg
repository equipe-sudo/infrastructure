# ============================================================
# PM-04 — Configuração do Ansible (Smart Construction)
# ============================================================
# As VMs são Amazon Linux 2023; o usuário remoto é `ec2-user` (sudo sem senha).
# Nada aqui contém segredos — eles são gerados no host (ver roles).

[defaults]
inventory = inventory.yml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
interpreter_python = auto_silent
# Não exibir hosts pulados (reduz ruído; segredos nunca são logados via no_log).
display_skipped_hosts = False

[ssh_connection]
pipelining = True

[privilege_escalation]
become = True
become_method = sudo
become_user = root
