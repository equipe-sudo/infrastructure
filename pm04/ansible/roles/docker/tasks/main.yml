---
# ============================================================
# Role: docker
# ============================================================
# Instala Docker CE (repo oficial) + plugin compose, inicia/enable o
# daemon, adiciona o usuário `opc` ao grupo docker e instala os pacotes
# extras de `extra_packages` (lista separada por vírgula).
#
# Idempotência: módulos dnf (state present), get_url (só baixa se mudou),
# systemd (estado desejado) e user (append) são todos idempotentes.

# ---------------------------------------------------------------
# 0. Swap (segurança para VMs E2.1.Micro de 1 GB de RAM)
#    Idempotente: `creates` pula quando /swapfile já existe.
# ---------------------------------------------------------------
- name: Criar swap de 2 GB (necessário nas VMs de 1 GB)
  ansible.builtin.shell: |
    dd if=/dev/zero of=/swapfile bs=1M count=2048
    chmod 600 /swapfile
    mkswap /swapfile
    swapon /swapfile
    grep -q '/swapfile' /etc/fstab || echo '/swapfile swap swap defaults 0 0' >> /etc/fstab
  args:
    creates: /swapfile

- name: Instalar pacotes extras (extra_packages)
  ansible.builtin.dnf:
    name: "{{ extra_packages.split(',') | map('trim') | reject('equalto', '') | list }}"
    state: present
  when: extra_packages | default('') | length > 0

- name: Adicionar repositório oficial do Docker CE
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/centos/docker-ce.repo
    dest: /etc/yum.repos.d/docker-ce.repo
    mode: '0644'

- name: Instalar Docker Engine + plugin Compose
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Iniciar e habilitar o daemon Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Adicionar usuário opc ao grupo docker
  ansible.builtin.user:
    name: opc
    groups: docker
    append: true
