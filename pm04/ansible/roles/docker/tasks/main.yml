---
# ============================================================
# Role: docker
# ============================================================
# Instala Docker CE (repo oficial) + plugin compose, inicia/enable o
# daemon, adiciona o usuário `ec2-user` ao grupo docker e instala os
# pacotes extras de `extra_packages` (lista separada por vírgula).
#
# Idempotência: módulos dnf (state present), get_url (só baixa se mudou),
# replace (só altera se o padrão existir), systemd (estado desejado) e
# user (append) são todos idempotentes.

# ---------------------------------------------------------------
# 0. Swap (segurança para VMs t3.micro de 1 GB de RAM)
#    O AL2023 só ativa swap/zram automaticamente em instâncias com
#    MENOS de 800 MB (t3.nano etc.); a t3.micro (1 GB) NÃO tem swap por
#    padrão, então criamos um swapfile de 2 GB. Idempotente: `creates`
#    pula quando /swapfile já existe.
# ---------------------------------------------------------------
- name: Criar swap de 2 GB (necessário na VM de 1 GB)
  ansible.builtin.shell: |
    dd if=/dev/zero of=/swapfile bs=1M count=2048
    chmod 600 /swapfile
    mkswap /swapfile
    swapon /swapfile
    grep -q '/swapfile' /etc/fstab || echo '/swapfile swap swap defaults 0 0' >> /etc/fstab
  args:
    creates: /swapfile

- name: Instalar pacotes extras (extra_packages)
  ansible.builtin.dnf:
    name: "{{ extra_packages.split(',') | map('trim') | reject('equalto', '') | list }}"
    state: present
  when: extra_packages | default('') | length > 0

- name: Adicionar repositório oficial do Docker CE (CentOS, compatível com AL2023)
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/centos/docker-ce.repo
    dest: /etc/yum.repos.d/docker-ce.repo
    mode: '0644'

# O AL2023 não está listado no repo do Docker e resolve $releasever como
# "2023", que não existe no layout centos/. Fixamos para 9 (base RHEL/CentOS 9
# do AL2023). `replace` é idempotente: no 2º run o padrão não existe mais.
- name: Apontar $releasever do repo Docker para 9 (compatibilidade AL2023)
  ansible.builtin.replace:
    path: /etc/yum.repos.d/docker-ce.repo
    regexp: '\$releasever'
    replace: '9'

- name: Instalar Docker Engine + plugin Compose
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Iniciar e habilitar o daemon Docker
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Adicionar usuário ec2-user ao grupo docker
  ansible.builtin.user:
    name: ec2-user
    groups: docker
    append: true
