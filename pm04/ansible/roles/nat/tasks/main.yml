---
# ============================================================
# Role: nat (VM app)
# ============================================================
# Transforma a VM app em NAT para o banco (subnet privada, SEM IP
# público), permitindo o egress do banco (Docker/pacotes/OS updates).
# No AWS, o egress de subnet privada normalmente usa NAT Gateway/NAT
# instance; aqui reaproveitamos a VM app como NAT instance. O Terraform
# deve desabilitar o Source/Destination Check na ENI da app e apontar a
# rota 0.0.0.0/0 da subnet do banco para a app.
#
# AL2023 NÃO instala firewalld por padrão; o backend de firewall é o
# iptables-nft. Garantimos o pacote (fornece o binário `iptables`) e
# aplicamos ip_forward + FORWARD ACCEPT + MASQUERADE.
#
# Idempotência: dnf (state present), sysctl (idempotente) e iptables -C
# (verifica antes de adicionar). Tudo com changed_when: false para não
# gerar "changed" espúrio no 2º run.

- name: Garantir iptables-nft (backend de firewall do AL2023)
  ansible.builtin.dnf:
    name: iptables-nft
    state: present

- name: Habilitar IP forwarding (persistente)
  ansible.builtin.shell: |
    sysctl -w net.ipv4.ip_forward=1 >/dev/null
    grep -q '^net.ipv4.ip_forward' /etc/sysctl.conf || echo 'net.ipv4.ip_forward = 1' >> /etc/sysctl.conf
  changed_when: false

- name: Habilitar masquerade e forwarding (NAT do banco)
  ansible.builtin.shell: |
    # firewalld (persistente), se por acaso estiver instalado/ativo
    if systemctl is-active --quiet firewalld; then
      firewall-cmd --permanent --add-masquerade >/dev/null 2>&1 || true
      firewall-cmd --reload >/dev/null 2>&1 || true
    fi
    # FORWARD: permite o tráfego banco -> internet (e a resposta), idempotente
    iptables -C FORWARD -s {{ db_subnet_cidr }} -j ACCEPT 2>/dev/null || \
      iptables -A FORWARD -s {{ db_subnet_cidr }} -j ACCEPT
    iptables -C FORWARD -d {{ db_subnet_cidr }} -j ACCEPT 2>/dev/null || \
      iptables -A FORWARD -d {{ db_subnet_cidr }} -j ACCEPT
    # MASQUERADE do tráfego de SAÍDA do banco (idempotente via -C)
    iptables -t nat -C POSTROUTING -s {{ db_subnet_cidr }} -j MASQUERADE 2>/dev/null || \
      iptables -t nat -A POSTROUTING -s {{ db_subnet_cidr }} -j MASQUERADE
  changed_when: false
