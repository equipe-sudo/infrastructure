# ============================================================
# Gateway Nginx — Smart Construction (HTTP -> HTTPS)
# ============================================================
# Única porta exposta no host (80/443). Redireciona /api/v1 para a API
# e o restante para o Next.js. HTTPS com certificado autoassinado em
# ./tls (gerado pelo Ansible) + headers de segurança e cookies seguros.

server {
    listen 80;
    server_name _;

    # Healthcheck interno (sem redirecionar, usado pelo compose).
    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/tls.crt;
    ssl_certificate_key /etc/nginx/tls/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Cabeçalhos de segurança / transporte.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 40m;

    location = /healthz {
        access_log off;
        return 200 'ok';
    }

    location /api/v1/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        # Defesa em profundidade: marca cookies como Secure no trânsito.
        # A API também marca quando SMART_API_ENVIRONMENT=production.
        proxy_cookie_secure on;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
