# ============================================================
# Smart Construction — aplicação (VM app)
# ============================================================
# Serviços: gateway (nginx), web (Next.js), api (FastAPI), api-migrate
# (alembic), storage (SeaweedFS editorial), private-storage (SeaweedFS
# privado) e os jobs de init. Segredos entram por bind mounts de
# .secrets/ (nunca por env com valor). O banco é externo (VM db):
# a API e a migração conectam em ${DB_PRIVATE_IP}:5432 pela rede privada.
#
# Interpolação de variáveis vem do arquivo `.env` no project_src
# (gerado pelo template .env.j2). Nenhum segredo é interpolado aqui.

services:
  web:
    image: ghcr.io/equipe-sudo/smart-construction-web:${DOCKER_TAG}
    environment:
      API_INTERNAL_URL: http://api:8000
      REGISTRATIONS_UI_ENABLED: ${REGISTRATIONS_UI_ENABLED:-true}
    depends_on:
      api:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped

  gateway:
    image: nginx:1.28-alpine
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/nginx/tls:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/healthz']
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api-migrate:
    image: ghcr.io/equipe-sudo/smart-construction-api:${DOCKER_TAG}
    command: ['alembic', 'upgrade', 'head']
    environment:
      SMART_API_DB_HOST: ${DB_PRIVATE_IP}
      SMART_API_DB_PORT: '5432'
      SMART_API_DB_USER: smart_migrator
      SMART_API_DB_PASSWORD_FILE: /run/secrets/migration_password
    volumes:
      - ./.secrets/backend/migration-password:/run/secrets/migration_password:ro
    restart: 'no'
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    logging:
      driver: local

  api:
    image: ghcr.io/equipe-sudo/smart-construction-api:${DOCKER_TAG}
    environment:
      SMART_API_ENVIRONMENT: ${SMART_API_ENVIRONMENT}
      SMART_API_ALLOWED_ORIGINS: '["https://${APP_PUBLIC_ORIGIN}"]'
      SMART_API_DB_HOST: ${DB_PRIVATE_IP}
      SMART_API_DB_PORT: '5432'
      SMART_API_DB_USER: smart_api
      SMART_API_DB_PASSWORD_FILE: /run/secrets/runtime_password
      SMART_API_REGISTRATIONS_ENABLED: ${SMART_API_REGISTRATIONS_ENABLED:-true}
      SMART_API_TERMS_VERSION: ${SMART_API_TERMS_VERSION:-termos-lab-2026-11-11}
      SMART_API_PRIVACY_VERSION: ${SMART_API_PRIVACY_VERSION:-privacidade-lab-2026-11-11}
      SMART_API_S3_ENDPOINT_URL: http://private-storage:8333
      SMART_API_S3_ACCESS_KEY_FILE: /run/secrets/private_api_access
      SMART_API_S3_SECRET_KEY_FILE: /run/secrets/private_api_secret
    volumes:
      - ./.secrets/backend/api-password:/run/secrets/runtime_password:ro
      - ./.secrets/backend/s3-api-access-key:/run/secrets/private_api_access:ro
      - ./.secrets/backend/s3-api-secret-key:/run/secrets/private_api_secret:ro
    depends_on:
      api-migrate:
        condition: service_completed_successfully
      private-storage-init:
        condition: service_completed_successfully
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    logging:
      driver: local

  private-storage:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ['/bin/sh', '/opt/backend-storage/private-storage.sh']
    volumes:
      - private-storage-data:/data
      - ./private-storage.sh:/opt/backend-storage/private-storage.sh:ro
      - ./.secrets/backend/s3-identities.json:/run/secrets/private_identities:ro
      - ./.secrets/backend/s3-admin-password:/run/secrets/private_admin_password:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9333/cluster/status']
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s
    restart: unless-stopped
    init: true
    logging:
      driver: local

  private-storage-init:
    image: ghcr.io/equipe-sudo/smart-construction-api:${DOCKER_TAG}
    command: ['python', '-m', 'app.arquivos.bootstrap']
    environment:
      SMART_API_S3_ENDPOINT_URL: http://private-storage:8333
      SMART_API_S3_ACCESS_KEY_FILE: /run/secrets/private_bootstrap_access
      SMART_API_S3_SECRET_KEY_FILE: /run/secrets/private_bootstrap_secret
    volumes:
      - ./.secrets/backend/s3-bootstrap-access-key:/run/secrets/private_bootstrap_access:ro
      - ./.secrets/backend/s3-bootstrap-secret-key:/run/secrets/private_bootstrap_secret:ro
    depends_on:
      private-storage:
        condition: service_healthy
    read_only: true
    tmpfs: ['/tmp']
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']
    restart: 'no'
    logging:
      driver: local

  storage:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ['/bin/sh', '/opt/storage/start.sh']
    environment:
      S3_BUCKET: ${ASSETS_BUCKET:-smart-assets}
    volumes:
      - storage-data:/data
      - ./storage:/opt/storage:ro
      - ./.secrets/storage/access-key:/run/secrets/storage_access_key:ro
      - ./.secrets/storage/secret-key:/run/secrets/storage_secret_key:ro
      - ./.secrets/storage/admin-password:/run/secrets/storage_admin_password:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9333/cluster/status']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    init: true
    restart: unless-stopped

  storage-init:
    image: amazon/aws-cli:2.38.3
    entrypoint: ['/bin/sh', '/opt/storage/init.sh']
    environment:
      S3_BUCKET: ${ASSETS_BUCKET:-smart-assets}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_PAGER: ''
    volumes:
      - ./storage:/opt/storage:ro
      - ./seed:/seed:ro
      - ./.secrets/storage/access-key:/run/secrets/storage_access_key:ro
      - ./.secrets/storage/secret-key:/run/secrets/storage_secret_key:ro
    depends_on:
      storage:
        condition: service_healthy
    restart: 'no'

volumes:
  storage-data:
  private-storage-data:
