apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cybervegas
data:
  cybervegas.json: |
    {
      "title": "CyberVegas — Aplicação",
      "uid": "cybervegas-app",
      "description": "Golden signals, jornada HTTP, dependências e capacidade do backend.",
      "tags": [
        "cybervegas",
        "tipo-especifico",
        "categoria-observability"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "15s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "SLO de disponibilidade",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(100 * sum(rate(http_server_duration_milliseconds_count{http_target=\"/health\",http_status_code=\"200\"}[5m])) / clamp_min(sum(rate(http_server_duration_milliseconds_count{http_target=\"/health\"}[5m])),0.000001)) or vector(100)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 1,
              "unit": "percent"
            }
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "SLO de dependência (PostgreSQL)",
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(100 * sum(rate(http_server_duration_milliseconds_count{http_target=\"/health/ready\",http_status_code=\"200\"}[5m])) / clamp_min(sum(rate(http_server_duration_milliseconds_count{http_target=\"/health/ready\"}[5m])),0.000001)) or vector(100)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 1,
              "unit": "percent"
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Erro do usuário / servidor",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(100 * sum(rate(http_server_duration_milliseconds_count{http_status_code=~\"4..|5..\"}[5m])) / clamp_min(sum(rate(http_server_duration_milliseconds_count[5m])),0.000001)) or vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 2,
              "unit": "percent"
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Ritmo de uso",
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_server_duration_milliseconds_count{http_target!~\"/health.*\"}[5m])) or vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 3,
              "unit": "reqps"
            }
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Jornada HTTP: volume por rota",
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(http_target)(rate(http_server_duration_milliseconds_count[5m]))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{http_target}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 3,
              "unit": "reqps"
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Jornada HTTP: tempo de resposta",
          "gridPos": {
            "x": 12,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.50,sum by(le,http_target)(rate(http_server_duration_milliseconds_bucket[5m])))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "p50 {{http_target}}"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95,sum by(le,http_target)(rate(http_server_duration_milliseconds_bucket[5m])))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "p95 {{http_target}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 2,
              "unit": "ms"
            }
          }
        },
        {
          "id": 7,
          "type": "table",
          "title": "Matriz de endpoints: rota × status",
          "gridPos": {
            "x": 0,
            "y": 13,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(http_target,http_status_code)(rate(http_server_duration_milliseconds_count[5m]))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{http_target}} / {{http_status_code}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 3,
              "unit": "reqps"
            }
          }
        },
        {
          "id": 8,
          "type": "table",
          "title": "Dependências e réplicas",
          "gridPos": {
            "x": 12,
            "y": 13,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_deployment_status_replicas_available{namespace=\"default\"}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{deployment}} disponíveis"
            },
            {
              "refId": "B",
              "expr": "kube_deployment_spec_replicas{namespace=\"default\"}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{deployment}} desejadas"
            },
            {
              "refId": "C",
              "expr": "kube_pod_status_ready{namespace=\"default\",condition=\"true\",pod=~\"postgres-.*\"}",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "postgres ready"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 2
            }
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Capacidade usada pelos Pods do backend",
          "gridPos": {
            "x": 0,
            "y": 21,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(pod)(rate(container_cpu_usage_seconds_total{namespace=\"default\",pod=~\"backend-.*\",container!=\"POD\",container!=\"\"}[5m]))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "CPU {{pod}}"
            },
            {
              "refId": "B",
              "expr": "sum by(pod)(container_memory_working_set_bytes{namespace=\"default\",pod=~\"backend-.*\",container!=\"POD\",container!=\"\"})/1024/1024",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "Memória MB {{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 2
            }
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Eventos de erro ao longo do tempo",
          "gridPos": {
            "x": 12,
            "y": 21,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_server_duration_milliseconds_count{http_status_code=~\"4..\"}[5m])) or vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "4xx"
            },
            {
              "refId": "B",
              "expr": "sum(rate(http_server_duration_milliseconds_count{http_status_code=~\"5..\"}[5m])) or vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "5xx"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 3,
              "unit": "reqps"
            }
          }
        }
      ],
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      },
      "links": []
    }
