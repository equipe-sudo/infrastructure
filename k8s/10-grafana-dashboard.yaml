# ============================================================
# Grafana — provisionamento do dashboard CyberVegas (auto-carrega)
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cybervegas
data:
  cybervegas.json: |
    {
      "title": "CyberVegas — Observabilidade (EXTRA)",
      "uid": "cybervegas-obs",
      "tags": ["cybervegas", "opentelemetry", "extra"],
      "timezone": "browser",
      "refresh": "10s",
      "schemaVersion": 39,
      "time": { "from": "now-15m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Requisições por segundo (por rota)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            { "refId": "A", "expr": "sum by (http_target) (rate(http_server_duration_milliseconds_count[5m]))", "legendFormat": "{{http_target}}" }
          ],
          "fieldConfig": { "defaults": { "unit": "reqps" } }
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Latência p95 (por rota)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            { "refId": "A", "expr": "histogram_quantile(0.95, sum by (le, http_target) (rate(http_server_duration_milliseconds_bucket[5m])))", "legendFormat": "{{http_target}}" }
          ],
          "fieldConfig": { "defaults": { "unit": "ms" } }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Requisições ativas",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            { "refId": "A", "expr": "http_server_active_requests", "legendFormat": "ativas" }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Respostas 4xx/5xx",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            { "refId": "A", "expr": "sum by (http_status_code) (rate(http_server_duration_milliseconds_count{http_status_code=~\"4..|5..\"}[5m]))", "legendFormat": "{{http_status_code}}" }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "CPU do nó (%)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "targets": [
            { "refId": "A", "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)", "legendFormat": "CPU" }
          ],
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 } }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Memória do nó (usada %)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "targets": [
            { "refId": "A", "expr": "100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)", "legendFormat": "Memória" }
          ],
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 } }
        }
      ]
    }
