apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cluster
data:
  cybervegas-cluster.json: |
    {
      "title": "CyberVegas — Cluster",
      "uid": "cybervegas-cluster",
      "description": "Command center para saúde dos Pods, workloads e capacidade do nó.",
      "tags": [
        "cybervegas",
        "tipo-especifico",
        "categoria-observability"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 2,
      "refresh": "15s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "gauge",
          "title": "Saúde dos Pods",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * sum(kube_pod_status_phase{phase=\"Running\"}) / clamp_min(count(kube_pod_info),1)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 1,
              "unit": "percent"
            }
          }
        },
        {
          "id": 2,
          "type": "gauge",
          "title": "Disponibilidade dos workloads",
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * sum(kube_deployment_status_replicas_available) / clamp_min(sum(kube_deployment_spec_replicas),1)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 1,
              "unit": "percent"
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Restarts recentes",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(kube_pod_container_status_restarts_total{container!=\"\"}[30m])) or vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "unit": "short"
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Pods em estado crítico",
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_status_phase{phase=~\"Pending|Failed|Unknown\"}) + count(kube_pod_container_status_waiting_reason{reason=~\"CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerConfigError|CreateContainerError\"} == 1) or vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "unit": "short"
            }
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Lifecycle dos Pods por namespace",
          "gridPos": {
            "x": 0,
            "y": 6,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(namespace,phase)(kube_pod_status_phase)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{namespace}} / {{phase}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 2
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Restarts por Pod",
          "gridPos": {
            "x": 12,
            "y": 6,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(10,sum(increase(kube_pod_container_status_restarts_total{container!=\"\"}[30m])) by(namespace,pod))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{namespace}} / {{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "unit": "short"
            }
          }
        },
        {
          "id": 7,
          "type": "table",
          "title": "Workloads: desejado × disponível",
          "gridPos": {
            "x": 0,
            "y": 14,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_deployment_spec_replicas",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{namespace}} / {{deployment}} desejadas"
            },
            {
              "refId": "B",
              "expr": "kube_deployment_status_replicas_available",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{namespace}} / {{deployment}} disponíveis"
            },
            {
              "refId": "C",
              "expr": "kube_deployment_status_replicas_unavailable",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{namespace}} / {{deployment}} indisponíveis"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "unit": "short"
            }
          }
        },
        {
          "id": 8,
          "type": "table",
          "title": "Pods críticos e motivo",
          "gridPos": {
            "x": 12,
            "y": 14,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_pod_container_status_waiting_reason{reason!=\"\"} == 1",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{namespace}}/{{pod}} {{reason}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 2
            }
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Pressão de CPU e memória do nó",
          "gridPos": {
            "x": 0,
            "y": 22,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m]))*100",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "CPU"
            },
            {
              "refId": "B",
              "expr": "100*(1-node_memory_MemAvailable_bytes/node_memory_MemTotal_bytes)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "Memória"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 1,
              "unit": "percent"
            }
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Pods por namespace",
          "gridPos": {
            "x": 12,
            "y": 22,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_info) by(namespace)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{namespace}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "unit": "short"
            }
          }
        }
      ],
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      },
      "links": []
    }
