apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cluster
data:
  cybervegas-cluster.json: |
    {
      "title": "CyberVegas — Cluster",
      "uid": "cybervegas-cluster",
      "description": "Visão operacional concisa da saúde do cluster Kubernetes.",
      "tags": [
        "cybervegas",
        "tipo-especifico",
        "categoria-observability"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Pods problemáticos",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_status_phase{phase=~\"Pending|Failed|Unknown\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "pods"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            }
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Waiting crítica",
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(sum by(namespace,pod)(kube_pod_container_status_waiting_reason{reason=~\"CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerConfigError|CreateContainerError\"}==1)>0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "pods"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Deployments indisponíveis",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(sum by(namespace,deployment)(kube_deployment_status_replicas_unavailable)>0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "deployments"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Restarts no período",
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(kube_pod_container_status_restarts_total{container!=\"\"}[$__range]))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "restarts"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Pods por fase",
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_status_phase{phase=~\"Pending|Running|Succeeded|Failed|Unknown\"}) by(phase)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{phase}}"
            }
          ],
          "fieldConfig": {
            "defaults": {}
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Top 10 Pods por restart",
          "gridPos": {
            "x": 12,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(10,sum(increase(kube_pod_container_status_restarts_total{container!=\"\"}[$__range])) by(namespace,pod))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{namespace}}/{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {}
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "CPU e memória do nó",
          "gridPos": {
            "x": 0,
            "y": 13,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100-avg by(instance)(rate(node_cpu_seconds_total{mode=\"idle\"}[5m]))*100",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "CPU"
            },
            {
              "refId": "B",
              "expr": "100*(1-node_memory_MemAvailable_bytes/node_memory_MemTotal_bytes)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "memória"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            }
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Pods por namespace",
          "gridPos": {
            "x": 12,
            "y": 13,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_info) by(namespace)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{namespace}}"
            }
          ],
          "fieldConfig": {
            "defaults": {}
          }
        },
        {
          "id": 9,
          "type": "table",
          "title": "Deployments e réplicas",
          "gridPos": {
            "x": 0,
            "y": 21,
            "w": 24,
            "h": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_deployment_status_replicas_available",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{namespace}}/{{deployment}} disponíveis"
            },
            {
              "refId": "B",
              "expr": "kube_deployment_spec_replicas",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{namespace}}/{{deployment}} desejadas"
            }
          ],
          "fieldConfig": {
            "defaults": {}
          }
        }
      ],
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      },
      "links": []
    }
