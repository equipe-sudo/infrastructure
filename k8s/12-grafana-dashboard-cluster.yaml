# Provisioned Grafana dashboard
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cluster
data:
  cybervegas-cluster.json: |
    {
      "title": "CyberVegas — Cluster",
      "uid": "cybervegas-cluster",
      "tags": [
        "cybervegas",
        "cluster",
        "infrastructure"
      ],
      "timezone": "browser",
      "refresh": "10s",
      "schemaVersion": 39,
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Pods em estado problemático",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_status_phase{phase=~\"Pending|Failed|Unknown\"})"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Pods em waiting crítica",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(sum by (namespace,pod) (kube_pod_container_status_waiting_reason{reason=~\"CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerConfigError|CreateContainerError\"} == 1) > 0)"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Deployments indisponíveis",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(sum by (namespace,deployment) (kube_deployment_status_replicas_unavailable) > 0)"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Restarts no período",
          "gridPos": {
            "h": 6,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(kube_pod_container_status_restarts_total{container!=\"\"}[$__range]))"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Pods por fase",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_status_phase{phase=~\"Pending|Running|Succeeded|Failed|Unknown\"}) by (phase)",
              "legendFormat": "{{phase}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Top Pods por restart",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 6
          },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(10,sum(increase(kube_pod_container_status_restarts_total{container!=\"\"}[$__range])) by (namespace,pod))",
              "legendFormat": "{{namespace}}/{{pod}}"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Pods por namespace",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 14
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_info) by (namespace)",
              "legendFormat": "{{namespace}}"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "CPU e memória do nó Minikube",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 14
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 - avg by (instance)(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100",
              "legendFormat": "CPU"
            },
            {
              "refId": "B",
              "expr": "100 * (1-node_memory_MemAvailable_bytes/node_memory_MemTotal_bytes)",
              "legendFormat": "Memória"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            }
          }
        }
      ]
    }
