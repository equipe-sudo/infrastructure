# ============================================================
# Grafana — dashboard de saúde do CLUSTER (kube-state-metrics + node)
# Baseado no template [TEMPLATE] - Kubernetes Cluster Health do hub-grafana
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cluster
data:
  cybervegas-cluster.json: |
    {
      "title": "CyberVegas — Cluster (EXTRA)",
      "uid": "cybervegas-cluster",
      "tags": ["cybervegas", "cluster", "extra"],
      "timezone": "browser",
      "refresh": "10s",
      "schemaVersion": 39,
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Pods com falha (Pending/Failed/Unknown)",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "targets": [
            { "refId": "A", "expr": "sum(kube_pod_status_phase{phase=~\"Pending|Failed|Unknown\"})" }
          ],
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } } }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Pods em waiting crítica",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 0 },
          "targets": [
            { "refId": "A", "expr": "count(sum by (namespace, pod) (kube_pod_container_status_waiting_reason{reason=~\"CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerConfigError|CreateContainerError\"} == 1) > 0)" }
          ],
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } } }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Deployments indisponíveis",
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 0 },
          "targets": [
            { "refId": "A", "expr": "count(sum by (namespace, deployment) (kube_deployment_status_replicas_unavailable) > 0)" }
          ],
          "fieldConfig": { "defaults": { "color": { "mode": "thresholds" }, "thresholds": { "mode": "absolute", "steps": [ { "color": "green", "value": null }, { "color": "red", "value": 1 } ] } } }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Restarts no período",
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 0 },
          "targets": [
            { "refId": "A", "expr": "sum(increase(kube_pod_container_status_restarts_total{container!=\"\"}[$__range]))" }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Pods por fase",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "targets": [
            { "refId": "A", "expr": "sum(kube_pod_status_phase{phase=~\"Pending|Running|Succeeded|Failed|Unknown\"}) by (phase)", "legendFormat": "{{phase}}" }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Top 10 pods com mais restarts",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "targets": [
            { "refId": "A", "expr": "topk(10, sum(increase(kube_pod_container_status_restarts_total{container!=\"\"}[$__range])) by (namespace, pod))", "legendFormat": "{{namespace}}/{{pod}}" }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "CPU do nó (%)",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 14 },
          "targets": [
            { "refId": "A", "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)", "legendFormat": "CPU" }
          ],
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 } }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Memória do nó (usada %)",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 14 },
          "targets": [
            { "refId": "A", "expr": "100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)", "legendFormat": "Memória" }
          ],
          "fieldConfig": { "defaults": { "unit": "percent", "min": 0, "max": 100 } }
        }
      ]
    }
