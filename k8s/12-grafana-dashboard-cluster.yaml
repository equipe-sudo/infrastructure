apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cluster
data:
  cybervegas-cluster.json: |
    {
      "title": "CyberVegas — Cluster",
      "uid": "cybervegas-cluster",
      "description": "Saúde do Kubernetes baseada em kube-state-metrics, node-exporter e estado dos targets.",
      "tags": [
        "cybervegas",
        "tipo-especifico",
        "categoria-observability"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 3,
      "refresh": "15s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Pods não saudáveis — aplicação",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_status_phase{namespace=\"default\",phase=~\"Pending|Failed|Unknown\"}) or vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "noValue": "Nenhum Pod problemático",
              "decimals": 2,
              "unit": "short"
            }
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Pods em espera crítica",
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(sum by(namespace,pod)(kube_pod_container_status_waiting_reason{namespace=\"default\",reason=~\"CrashLoopBackOff|ImagePullBackOff|ErrImagePull|CreateContainerConfigError|CreateContainerError\"}) == 1) or vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "noValue": "Nenhum Pod em espera",
              "decimals": 2,
              "unit": "short"
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Deployments indisponíveis",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(sum by(namespace,deployment)(kube_deployment_status_replicas_unavailable{namespace=\"default\"}) > 0) or vector(0)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "noValue": "Todos disponíveis",
              "decimals": 2,
              "unit": "short"
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Targets de observabilidade ativos",
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(up{job=~\"otel-collector|node-exporter|kube-state-metrics\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "noValue": "Nenhum target",
              "decimals": 2,
              "unit": "short"
            }
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Pods por fase — namespace da aplicação",
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by(phase)(kube_pod_status_phase{namespace=\"default\"})",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{phase}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "noValue": "Sem dados de Pods",
              "decimals": 2,
              "unit": "short"
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Restarts por Pod — namespace da aplicação",
          "gridPos": {
            "x": 12,
            "y": 5,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "topk(10,sum(increase(kube_pod_container_status_restarts_total{namespace=\"default\",container!=\"\"}[30m])) by(pod))",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{pod}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "noValue": "Nenhum restart no período",
              "decimals": 2,
              "unit": "short"
            }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "CPU e memória do nó",
          "gridPos": {
            "x": 0,
            "y": 13,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "CPU"
            },
            {
              "refId": "B",
              "expr": "100 * (1-node_memory_MemAvailable_bytes/node_memory_MemTotal_bytes)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "Memória"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "noValue": "Sem métrica do nó",
              "decimals": 2,
              "unit": "percent"
            }
          }
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Pods por namespace",
          "gridPos": {
            "x": 12,
            "y": 13,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_info) by(namespace)",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{namespace}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "noValue": "Sem Pods",
              "decimals": 2,
              "unit": "short"
            }
          }
        },
        {
          "id": 9,
          "type": "table",
          "title": "Workloads: desejado × disponível",
          "gridPos": {
            "x": 0,
            "y": 21,
            "w": 24,
            "h": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "kube_deployment_spec_replicas",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{namespace}}/{{deployment}} desejadas"
            },
            {
              "refId": "B",
              "expr": "kube_deployment_status_replicas_available",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{namespace}}/{{deployment}} disponíveis"
            },
            {
              "refId": "C",
              "expr": "kube_deployment_status_replicas_unavailable",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "legendFormat": "{{namespace}}/{{deployment}} indisponíveis"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "noValue": "Sem Deployments",
              "decimals": 2,
              "unit": "short"
            }
          }
        }
      ],
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      },
      "links": []
    }
