# ============================================================
# Frontend (Angular servido por nginx) — Deployment + Service
# ============================================================
# - 2 réplicas do nginx que serve o build do Angular.
# - O nginx.conf interno faz proxy de /api/* para o Service
#   "backend" (http://backend:8000/), então o Angular usa URL
#   relativa /api e o balanceamento acontece no cluster.
# - Service NodePort para acesso pelo navegador via
#   `minikube service frontend --url`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: cybervegas-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
