# ============================================================
# Secrets — credenciais do PostgreSQL e string de conexão
# ============================================================
# Credenciais de DEMONSTRAÇÃO (ambiente local/minikube).
# Em produção, gere valores fortes e injete por um gerenciador
# de segredos (não versione em texto).
apiVersion: v1
kind: Secret
metadata:
  name: cybervegas-secrets
type: Opaque
stringData:
  POSTGRES_USER: cybervegas
  POSTGRES_PASSWORD: cybervegas
  POSTGRES_DB: cybervegas
  # DATABASE_URL aponta para o Service "postgres" (DNS interno do cluster).
  DATABASE_URL: postgresql://cybervegas:cybervegas@postgres:5432/cybervegas
