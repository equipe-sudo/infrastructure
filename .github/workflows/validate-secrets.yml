name: Validate Secrets

on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        run: |
          echo "============================================="
          echo "  Validate Secrets — equipe-sudo/infrastructure"
          echo "============================================="
          echo ""
          echo "✓ VM_PUBLIC_IP            : ${{ secrets.VM_PUBLIC_IP != '' }}"
          echo "✓ SSH_PRIVATE_KEY         : ${{ secrets.SSH_PRIVATE_KEY != '' }}"
          echo "✓ OCIR_USERNAME           : ${{ secrets.OCIR_USERNAME != '' }}"
          echo "✓ OCIR_AUTH_TOKEN         : ${{ secrets.OCIR_AUTH_TOKEN != '' }}"
          echo "✓ CLOUDFLARE_TUNNEL_TOKEN : ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN != '' }}"
          echo ""
          echo "Todos os secrets de organização estão acessíveis!"
