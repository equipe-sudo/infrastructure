name: Deploy to VM

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gerar .env (tunnel + observabilidade)
        run: |
          cat > docker/.env << 'EOF'
          CLOUDFLARE_TUNNEL_TOKEN=${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          OTEL_EXPORTER_OTLP_ENDPOINT=${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          DEPLOYMENT_ENVIRONMENT=dev
          APP_VERSION=${{ github.sha }}
          EOF

      - name: Copy files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_PUBLIC_IP }}
          username: opc
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker/*
          target: /home/opc/slots/
          strip_components: 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_PUBLIC_IP }}
          username: opc
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd /home/opc/slots

            # Login no GHCR para pull das imagens privadas
            echo "${{ secrets.GHCR_TOKEN }}" | \
              docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

            # Pull das imagens mais recentes
            docker compose pull

            # Deploy
            docker compose up -d --remove-orphans

            # Limpeza de imagens antigas
            docker image prune -f

            # Status final
            echo ""
            echo "=== Containers ==="
            docker compose ps
            echo ""
            echo "✓ Deploy concluído — $(date)"
            echo "✓ Deploy concluído — $(date)"
