name: Deploy to VM

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_PUBLIC_IP }}
          username: opc
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: docker/*
          target: /home/opc/slots/
          strip_components: 1

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_PUBLIC_IP }}
          username: opc
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: CLOUDFLARE_TUNNEL_TOKEN,OCIR_AUTH_TOKEN,OCIR_USERNAME
          script: |
            cd /home/opc/slots

            # Salva token do Cloudflare Tunnel no .env local (persiste entre deploys)
            echo "CLOUDFLARE_TUNNEL_TOKEN=$CLOUDFLARE_TUNNEL_TOKEN" > .env

            # Login no OCIR para pull das imagens
            echo "$OCIR_AUTH_TOKEN" | \
              docker login gru.ocir.io -u "$OCIR_USERNAME" --password-stdin

            # Pull das imagens mais recentes
            docker compose pull

            # Deploy
            docker compose up -d --remove-orphans

            # Limpeza de imagens antigas
            docker image prune -f

            # Status final
            echo ""
            echo "=== Containers ==="
            docker compose ps
            echo ""
            echo "✓ Deploy concluído — $(date)"
