name: Build & Push Backend

on:
  workflow_dispatch:

env:
  OCIR_REGISTRY: gru.ocir.io
  OCIR_NAMESPACE: grhkdi3glvat
  IMAGE_NAME: equipe-sudo/equipe-sudo-backend

jobs:
  build-and-push:
    name: Build & Push Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: equipe-sudo/backend
          ref: main
          token: ${{ secrets.CI_PAT }}
          path: backend

      - name: Capturar SHA do backend
        id: meta
        run: echo "sha=$(git -C backend rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.OCIR_REGISTRY }}
          username: ${{ secrets.OCIR_USERNAME }}
          password: ${{ secrets.OCIR_AUTH_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.OCIR_REGISTRY }}/${{ env.OCIR_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.OCIR_REGISTRY }}/${{ env.OCIR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
