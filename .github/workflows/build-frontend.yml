name: Build & Push Frontend

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/equipe-sudo/equipe-sudo-frontend

jobs:
  build-and-push:
    name: Build & Push Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app fork
        uses: actions/checkout@v4
        with:
          repository: equipe-sudo/aula-uniamerica-infraestrutura-cloud
          ref: main
          token: ${{ secrets.CI_PAT }}
          path: app

      - name: Capturar SHA do app
        id: meta
        run: echo "sha=$(git -C app rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: app/frontend
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
